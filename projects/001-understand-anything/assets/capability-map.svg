<text x="935" y="336" font-size="18" fill="#213e33" font-weight="500">页面 / 组件 / 实例 / 设计变量</text>
<text x="935" y="371" font-size="18" fill="#6e7c70" font-weight="400">经 Figma REST API 读取对象。</text>
<text x="935" y="398" font-size="18" fill="#6e7c70" font-weight="400">需要文件 URL 或 key 与 token；</text>
<text x="935" y="425" font-size="18" fill="#6e7c70" font-weight="400">分析已有设计的结构与引用。</text>
<rect x="1342" y="266" width="406" height="183" rx="14" fill="#fffef9" stroke="#d8dfce"/>
<rect x="1342" y="266" width="6" height="183" rx="0" fill="#a57b36" stroke="#a57b36"/>
