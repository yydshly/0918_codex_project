<text x="75" y="336" font-size="18" fill="#213e33" font-weight="500">源码 / 配置 / SQL / 项目文档</text>
<text x="75" y="371" font-size="18" fill="#6e7c70" font-weight="400">程序读取文件、语法与结构。</text>
<text x="75" y="398" font-size="18" fill="#6e7c70" font-weight="400">业务领域可从已有代码图谱归纳，</text>
<text x="75" y="425" font-size="18" fill="#6e7c70" font-weight="400">也可通过轻量扫描获取上下文。</text>
