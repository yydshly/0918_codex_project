<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2020" viewBox="0 0 1800 2020" role="img" aria-labelledby="title desc"><title id="title">Understand Anything 能力全景</title><desc id="desc">从代码、Wiki、Figma 或已有图谱输入，经程序提取、大模型或人理解、校验合并与布局，形成四类图谱，用于项目理解、改动排查与知识沉淀。下方注明实测范围和能力边界。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#798873"/></marker></defs><g font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif"><rect x="0" y="0" width="1800" height="2020" rx="0" fill="#f5f5ed" stroke="#f5f5ed"/>
<rect x="0" y="0" width="1800" height="190" rx="0" fill="#213e33" stroke="#213e33"/>
<text x="52" y="47" font-size="18" fill="#c4d8ae" font-weight="500">OPEN SOURCE RESEARCH  /  001</text>
<text x="52" y="104" font-size="46" fill="#f6f7e9" font-weight="650">Understand Anything · 一图理解</text>
<text x="52" y="151" font-size="24" fill="#d2ddcb" font-weight="400">把源码与资料，变成可探索、可解释、可回查的知识图谱。</text>
