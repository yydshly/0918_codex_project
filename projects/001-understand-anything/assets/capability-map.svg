<text x="505" y="336" font-size="18" fill="#213e33" font-weight="500">文章 / 双向链接 / 原始来源</text>
<text x="505" y="371" font-size="18" fill="#6e7c70" font-weight="400">读取约定的 Wiki 目录结构。</text>
<text x="505" y="398" font-size="18" fill="#6e7c70" font-weight="400">显式链接可以直接解析；</text>
<text x="505" y="425" font-size="18" fill="#6e7c70" font-weight="400">隐含知识关系需语义分析。</text>
<rect x="912" y="266" width="406" height="183" rx="14" fill="#fffef9" stroke="#d8dfce"/>
