<text x="62" y="242" font-size="18" fill="#e2efc5" font-weight="600">01</text>
<text x="108" y="242" font-size="27" fill="#213e33" font-weight="650">输入从哪里来</text>
<text x="480" y="242" font-size="18" fill="#6e7c70" font-weight="400">来源不同，提取路径不同；数据需要访问权限与对应材料。</text>
<rect x="52" y="266" width="406" height="183" rx="14" fill="#fffef9" stroke="#d8dfce"/>
<rect x="52" y="266" width="6" height="183" rx="0" fill="#547c58" stroke="#547c58"/>
