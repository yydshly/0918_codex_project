<text x="1365" y="336" font-size="18" fill="#213e33" font-weight="500">合规 JSON / 人或工具整理的数据</text>
<text x="1365" y="371" font-size="18" fill="#6e7c70" font-weight="400">已有图谱可直接进入浏览。</text>
<text x="1365" y="398" font-size="18" fill="#6e7c70" font-weight="400">无需每次重新调用大模型；</text>
<text x="1365" y="425" font-size="18" fill="#6e7c70" font-weight="400">业务领域、源码查看另需对应数据。</text>
