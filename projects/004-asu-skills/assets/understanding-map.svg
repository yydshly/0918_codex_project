<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="3010" viewBox="0 0 1920 3010" role="img" aria-labelledby="title desc"><title id="title">ASu-skills 能力、技术原理与个人价值总览</title><desc id="desc">九个技能的功能、产出和作用，以及技能流程、宿主人工智能、模板工具的协作方式。包括使用流程、对当前研究的价值和验证边界。</desc><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif} .mono{font-family:Consolas,'Microsoft YaHei',monospace}</style>
<rect x="0" y="0" width="1920" height="3010" rx="0" fill="#f4f7f9"/>
<rect x="0" y="0" width="1920" height="230" rx="0" fill="#12323f"/>
<rect x="80" y="52" width="8" height="57" rx="3" fill="#67e2c4"/>
<text x="112" y="98" font-size="66" fill="#ffffff" font-weight="700">ASu-skills</text>
<text x="529" y="98" font-size="48" fill="#ffffff" font-weight="600">能力与原理全景图</text>
<text x="82" y="159" font-size="29" fill="#bce0e5" font-weight="400">9 个求职 Skill  ·  一套由 AI 执行的工作流  ·  模板与自动化脚本配套</text>
<text x="82" y="204" font-size="27" fill="#67e2c4" font-weight="400">核心资产：将求职经验结构化，连接材料、证据、表达、交付与验证。</text>
<rect x="80" y="268" width="552" height="155" rx="16" fill="#ffffff" stroke="#d8e2e8" stroke-width="2"/>
<text x="104" y="311" font-size="29" fill="#19333f" font-weight="700">01  SKILL 定义流程</text>
<text x="104" y="353" font-size="25" fill="#526977" font-weight="400">触发条件 / 所需材料 / 操作步骤</text>
<text x="104" y="391" font-size="25" fill="#526977" font-weight="400">输出规范 / 事实边界 / 确认节点</text>
<rect x="684" y="268" width="552" height="155" rx="16" fill="#e6f3ef" stroke="#d8e2e8" stroke-width="2"/>
<text x="708" y="311" font-size="29" fill="#08775f" font-weight="700">02  宿主 AI 理解与决策</text>
<text x="708" y="353" font-size="25" fill="#526977" font-weight="400">读取规则与参考资料，分析用户材料</text>
<text x="708" y="391" font-size="25" fill="#526977" font-weight="400">通常由同一个 AI 按任务切换技能</text>
<rect x="1288" y="268" width="552" height="155" rx="16" fill="#ffffff" stroke="#d8e2e8" stroke-width="2"/>
<text x="1312" y="311" font-size="29" fill="#19333f" font-weight="700">03  工具与资源执行交付</text>
<text x="1312" y="353" font-size="25" fill="#526977" font-weight="400">文件与代码工具 / 浏览器 / GitHub</text>
<text x="1312" y="391" font-size="25" fill="#526977" font-weight="400">简历模板 / HTML 编辑 / PDF 脚本</text>
<text x="645" y="358" font-size="35" fill="#08775f" font-weight="600">→</text>
<text x="1249" y="358" font-size="35" fill="#08775f" font-weight="600">→</text>
<text x="80" y="465" font-size="27" fill="#19333f" font-weight="500">有工具支持：AI 可直接生成文件、修改代码或填写网页；工具不足：提供分析、计划和操作指导。</text>
<text x="80" y="506" font-size="25" fill="#526977" font-weight="400">九个入口是工作流划分，不代表九个独立智能体；执行质量取决于模型、材料和工具环境。</text>
<text x="80" y="580" font-size="26" fill="#08775f" font-weight="700" class="mono">01</text>
<text x="137" y="580" font-size="38" fill="#19333f" font-weight="700">九个 Skill：从输入材料到可用结果</text>
<text x="137" y="624" font-size="23" fill="#526977" font-weight="400">每张卡片分别说明功能、交付物与预期帮助；预期帮助不等于已测得的效果。</text>
