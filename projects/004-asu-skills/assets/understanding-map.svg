<text x="107" y="1975" font-size="25" fill="#19333f" font-weight="700">两条具体技术链路</text>
<text x="107" y="2016" font-size="25" fill="#19333f" font-weight="400">简历导出：HTML → Node.js → Chrome / Edge 的 CDP → Page.printToPDF → PDF</text>
<text x="107" y="2053" font-size="25" fill="#19333f" font-weight="400">网页填写：AI → WebBridge 本机服务与扩展 → CDP → 当前页面 → 重新读取核对</text>
<text x="80" y="2130" font-size="26" fill="#08775f" font-weight="700" class="mono">03</text>
<text x="137" y="2130" font-size="38" fill="#19333f" font-weight="700">如何串起来：按需要选择入口</text>
<text x="137" y="2174" font-size="23" fill="#526977" font-weight="400">以下是组合建议，步骤之间不会自动继承外部操作授权。</text>
<rect x="80" y="2200" width="1760" height="133" rx="14" fill="#ffffff" stroke="#d8e2e8" stroke-width="2"/>
<text x="107" y="2245" font-size="25" fill="#08775f" font-weight="700">求职路径</text>
<text x="262" y="2245" font-size="26" fill="#19333f" font-weight="400">项目导学 / 证据复盘 → 简历提升 → 简历制作 → 岗位匹配 → 申请填写 → 进度管理</text>
<text x="107" y="2295" font-size="25" fill="#08775f" font-weight="700">补强循环</text>
<text x="262" y="2295" font-size="26" fill="#19333f" font-weight="400">开源贡献补充真实经历；面试训练暴露薄弱主张 → 补证据、补知识或调整表述 → 复练</text>
<text x="80" y="2400" font-size="26" fill="#08775f" font-weight="700" class="mono">04</text>
<text x="137" y="2400" font-size="38" fill="#19333f" font-weight="700">对你的价值：从研究一个库，到积累自己的方法</text>
<rect x="80" y="2438" width="560" height="156" rx="14" fill="#e6f3ef"/>
<text x="103" y="2480" font-size="27" fill="#08775f" font-weight="700">最直接：固化研究流程</text>
<text x="103" y="2524" font-size="23" fill="#19333f" font-weight="400">复用“定位—能力—原理—边界—文档/Web”</text>
<text x="103" y="2561" font-size="23" fill="#19333f" font-weight="400">下次分析其他库，可按同一标准开展。</text>
<rect x="680" y="2438" width="560" height="156" rx="14" fill="#e6f3ef"/>
<text x="703" y="2480" font-size="27" fill="#08775f" font-weight="700">值得积累：区分成果与能力</text>
<text x="703" y="2524" font-size="23" fill="#19333f" font-weight="400">借鉴 project-guide 与 evidence-recap</text>
<text x="703" y="2561" font-size="23" fill="#19333f" font-weight="400">记录你的决策、AI 的工作和已验证结果。</text>
<rect x="1280" y="2438" width="560" height="156" rx="14" fill="#e6f3ef"/>
<text x="1303" y="2480" font-size="27" fill="#08775f" font-weight="700">按需采用：求职专项工具</text>
<text x="1303" y="2524" font-size="23" fill="#19333f" font-weight="400">简历、匹配、申请和面试围绕真实需求</text>
<text x="1303" y="2561" font-size="23" fill="#19333f" font-weight="400">当前尚不知道你的职业与求职计划。</text>
<rect x="80" y="2631" width="1760" height="220" rx="18" fill="#12323f"/>
<text x="109" y="2678" font-size="29" fill="#ffffff" font-weight="700">阅读这张图时，保留四个边界</text>
<text x="109" y="2724" font-size="24" fill="#d2e2e8" font-weight="400">① 技能规定主要是给模型的指令；桥接客户端并未独立核验“用户已批准”。</text>
<text x="109" y="2765" font-size="24" fill="#d2e2e8" font-weight="400">② 安装 Skill 不会自动获得工具、登录权限或持续后台监控能力。</text>
<text x="109" y="2806" font-size="24" fill="#d2e2e8" font-weight="400">③ 本机浏览器桥接不代表全流程离线。  ④ 证据账本与面试反馈不等于事实认证或录用保证。</text>
