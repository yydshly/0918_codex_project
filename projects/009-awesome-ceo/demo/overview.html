<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Awesome CEO · 一图看懂</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeee6;color:#253b3d;font-family:system-ui,'Microsoft YaHei',sans-serif}header{display:flex;align-items:center;gap:14px;padding:16px 22px;background:#fffefa;border-bottom:1px solid #dcded5;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}a{color:inherit;font-size:13px}button{font:inherit;background:#f7f5f0;border:1px solid #c4ccc5;border-radius:4px;cursor:pointer;padding:8px 14px}button:focus-visible,a:focus-visible{outline:3px solid #9e493c;outline-offset:3px}#viewer{width:100%;height:calc(100dvh - 140px);overflow:auto;padding:16px}img{display:block;margin:auto;max-width:none;width:100%;height:auto}footer{padding:8px 22px;font-size:12px;color:#647473;line-height:1.7}#scale{min-width:48px;text-align:center;font-size:12px}@media(max-width:600px){header{padding:12px;gap:10px}h1{width:100%;font-size:16px}#viewer{height:calc(100dvh - 190px);padding:8px}footer{padding:8px 12px;font-size:11px}}</style></head><body><header><h1>Awesome CEO · 一图看懂</h1><nav aria-label="图片查看"><a href="./index.html#map">← 返回资料导航</a><button id="zoom-out" aria-label="缩小">−</button><output id="scale" aria-live="polite">适应</output><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应窗口</button><a href="../assets/understanding-map.png" download>下载原图 ↓</a></nav></header><main id="viewer" tabindex="0" aria-label="总览图，可滚动查看"><img id="map-image" src="../assets/understanding-map.png" alt="Awesome CEO 是创业与管理资料导航。85条资源按文章指南问答45、书籍课程11、目录13、案例6、框架清单4、模板工具演示视频6归类；另有11个业务主题。人工筛选后用README分类，读者点击外链自行阅读与实践。适合作为备查目录，技术复用价值较低。"></main><footer>原创概念汇总，非上游软件截图。类型与主题是同一批资料的两个视角。放大后可横向、纵向滚动查看。</footer><script>const img=document.querySelector('#map-image'),label=document.querySelector('#scale');let scale=1;function apply(){img.style.width=(scale*100)+'%';label.textContent=scale===1?'适应':Math.round(scale*100)+'%';document.querySelector('#zoom-out').disabled=scale<=1;document.querySelector('#zoom-in').disabled=scale>=3}document.querySelector('#zoom-in').onclick=()=>{scale=Math.min(3,scale+.25);apply()};document.querySelector('#zoom-out').onclick=()=>{scale=Math.max(1,scale-.25);apply()};document.querySelector('#fit').onclick=()=>{scale=1;apply();document.querySelector('#viewer').scrollTo(0,0)};apply();</script></body></html>
