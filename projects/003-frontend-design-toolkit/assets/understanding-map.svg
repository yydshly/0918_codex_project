<text id="t19" x="654" y="522" font-size="27" fill="#192d49" font-weight="700" text-anchor="start" data-bound="650,492,1150,648">全站主题与设计规范</text>
<text id="t20" x="654" y="562" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="650,492,1150,648">让多个页面使用同一套设计语言</text>
<text id="t21" x="654" y="596" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="650,492,1150,648">共享颜色、间距、字号与明暗主题</text>
<text id="t22" x="654" y="630" font-size="18" fill="#315ecd" font-weight="400" text-anchor="start" data-bound="650,492,1150,648">参考：CLAUDE.md / Design Tokens</text>
<rect x="1190" y="480" width="540" height="176" rx="14" fill="#fff" stroke="#d8e3ed"/>
