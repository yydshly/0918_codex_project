<text id="t17" x="94" y="596" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="90,492,590,648">字体、色彩、构图与内容层次</text>
<text id="t18" x="94" y="630" font-size="18" fill="#315ecd" font-weight="400" text-anchor="start" data-bound="90,492,590,648">参考：Frontend Design / Taste Skill</text>
