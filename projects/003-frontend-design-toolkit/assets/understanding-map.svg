<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2390" viewBox="0 0 1800 2390" role="img" aria-labelledby="title desc"><title id="title">指导 Claude Code 做好前端设计与实现</title><desc id="desc">Frontend Design Toolkit 是说明指南与工具索引。图中整理九个工作方面、执行原理、对我们前端工作的意义和证据边界。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif}</style>
<rect x="0" y="0" width="1800" height="2390" rx="0" fill="#f4f7fb" stroke="#f4f7fb"/>
