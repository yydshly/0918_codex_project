<text id="t24" x="1214" y="562" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="1210,492,1710,648">让运动服务于反馈和状态变化</text>
<text id="t25" x="1214" y="596" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="1210,492,1710,648">滚动、过渡、手势与动画性能</text>
<text id="t26" x="1214" y="630" font-size="18" fill="#315ecd" font-weight="400" text-anchor="start" data-bound="1210,492,1710,648">参考：GSAP / Motion 相关 Skills</text>
<rect x="70" y="676" width="540" height="176" rx="14" fill="#fff" stroke="#d8e3ed"/>
<text id="t27" x="94" y="718" font-size="27" fill="#192d49" font-weight="700" text-anchor="start" data-bound="90,688,590,844">用户体验与可访问性</text>
<text id="t28" x="94" y="758" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="90,688,590,844">围绕用户任务检查页面是否好用</text>
<text id="t29" x="94" y="792" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="90,688,590,844">流程、响应式、键盘与状态反馈</text>
<text id="t30" x="94" y="826" font-size="18" fill="#315ecd" font-weight="400" text-anchor="start" data-bound="90,688,590,844">参考：UX / Accessibility Skills</text>
<rect x="630" y="676" width="540" height="176" rx="14" fill="#fff" stroke="#d8e3ed"/>
<text id="t31" x="654" y="718" font-size="27" fill="#192d49" font-weight="700" text-anchor="start" data-bound="650,688,1150,844">设计稿与代码衔接</text>
<text id="t32" x="654" y="758" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="650,688,1150,844">为页面实现补充设计结构和规范</text>
<text id="t33" x="654" y="792" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="650,688,1150,844">读取设计稿，关联现有组件</text>
<text id="t34" x="654" y="826" font-size="18" fill="#315ecd" font-weight="400" text-anchor="start" data-bound="650,688,1150,844">参考：Figma MCP / Code Connect</text>
<rect x="1190" y="676" width="540" height="176" rx="14" fill="#fff" stroke="#d8e3ed"/>
<text id="t35" x="1214" y="718" font-size="27" fill="#192d49" font-weight="700" text-anchor="start" data-bound="1210,688,1710,844">浏览器测试与诊断</text>
<text id="t36" x="1214" y="758" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="1210,688,1710,844">运行页面，观察交互与视觉结果</text>
<text id="t37" x="1214" y="792" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="1210,688,1710,844">操作、截图、错误、网络和性能</text>
<text id="t38" x="1214" y="826" font-size="18" fill="#315ecd" font-weight="400" text-anchor="start" data-bound="1210,688,1710,844">参考：Playwright / DevTools</text>
<rect x="70" y="872" width="540" height="176" rx="14" fill="#fff" stroke="#d8e3ed"/>
<text id="t39" x="94" y="914" font-size="27" fill="#192d49" font-weight="700" text-anchor="start" data-bound="90,884,590,1040">文档检索与上下文</text>
<text id="t40" x="94" y="954" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="90,884,590,1040">为具体问题补充准确参考资料</text>
<text id="t41" x="94" y="988" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="90,884,590,1040">库版本、API 示例与文档内容</text>
<text id="t42" x="94" y="1022" font-size="18" fill="#315ecd" font-weight="400" text-anchor="start" data-bound="90,884,590,1040">参考：Context7 / 文档采集工具</text>
<rect x="630" y="872" width="540" height="176" rx="14" fill="#fff" stroke="#d8e3ed"/>
<text id="t43" x="654" y="914" font-size="27" fill="#192d49" font-weight="700" text-anchor="start" data-bound="650,884,1150,1040">框架与组件实现</text>
<text id="t44" x="654" y="954" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="650,884,1150,1040">补充不同技术栈的实现方法</text>
<text id="t45" x="654" y="988" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="650,884,1150,1040">React、Tailwind、图表与 3D</text>
<text id="t46" x="654" y="1022" font-size="18" fill="#315ecd" font-weight="400" text-anchor="start" data-bound="650,884,1150,1040">参考：框架 Skills / D3 / Three.js</text>
<rect x="1190" y="872" width="540" height="176" rx="14" fill="#fff" stroke="#d8e3ed"/>
<text id="t47" x="1214" y="914" font-size="27" fill="#192d49" font-weight="700" text-anchor="start" data-bound="1210,884,1710,1040">预览与部署交付</text>
<text id="t48" x="1214" y="954" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="1210,884,1710,1040">指导选择发布与预览工具</text>
<text id="t49" x="1214" y="988" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="1210,884,1710,1040">构建、预览地址与部署检查</text>
<text id="t50" x="1214" y="1022" font-size="18" fill="#315ecd" font-weight="400" text-anchor="start" data-bound="1210,884,1710,1040">参考：Vercel MCP / PinMe</text>
<text id="t51" x="70" y="1099" font-size="25" fill="#315ecd" font-weight="600" text-anchor="start">怎么选：先看自己的问题，再查对应章节；安装和权限以各工具的官方资料为准。</text>
<text id="t52" x="70" y="1134" font-size="21" fill="#53677f" font-weight="400" text-anchor="start">九项按原目录展开；展厅八类能力将“文档”与“框架知识”合并。上述工具是参考线索，未逐项实测。</text>
<rect x="70" y="1174" width="42" height="38" rx="7" fill="#315ecd" stroke="#315ecd"/>
<text id="t53" x="91" y="1201" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">02</text>
<text id="t54" x="128" y="1204" font-size="30" fill="#192d49" font-weight="700" text-anchor="start">为什么能帮助前端工作？</text>
<text id="t55" x="1730" y="1204" font-size="20" fill="#53677f" font-weight="400" text-anchor="end">核心：补充要求、参考资料、操作能力与反馈</text>
<rect x="70" y="1240" width="385" height="145" rx="14" fill="#fff" stroke="#d8e3ed"/>
<text id="t56" x="93" y="1281" font-size="27" fill="#192d49" font-weight="700" text-anchor="start" data-bound="88,1250,437,1375">人明确任务</text>
<text id="t57" x="93" y="1324" font-size="21" fill="#53677f" font-weight="400" text-anchor="start" data-bound="88,1250,437,1375">受众、内容、风格与验收条件</text>
<text id="t58" x="93" y="1356" font-size="21" fill="#53677f" font-weight="400" text-anchor="start" data-bound="88,1250,437,1375">决定“什么结果才算合适”</text>
<path d="M463 1314h23m-8-7 8 7-8 7" stroke="#8499b5" stroke-width="2.5" fill="none"/>
<rect x="495" y="1240" width="385" height="145" rx="14" fill="#eaf0ff" stroke="#d8e3ed"/>
<text id="t59" x="518" y="1281" font-size="27" fill="#315ecd" font-weight="700" text-anchor="start" data-bound="513,1250,862,1375">指南帮助组织输入</text>
<text id="t60" x="518" y="1324" font-size="21" fill="#53677f" font-weight="400" text-anchor="start" data-bound="513,1250,862,1375">Skills、项目规则与外部资料</text>
<text id="t61" x="518" y="1356" font-size="21" fill="#53677f" font-weight="400" text-anchor="start" data-bound="513,1250,862,1375">让设计和实现有具体依据</text>
<path d="M888 1314h23m-8-7 8 7-8 7" stroke="#8499b5" stroke-width="2.5" fill="none"/>
<rect x="920" y="1240" width="385" height="145" rx="14" fill="#fff" stroke="#d8e3ed"/>
<text id="t62" x="943" y="1281" font-size="27" fill="#192d49" font-weight="700" text-anchor="start" data-bound="938,1250,1287,1375">Claude Code 执行</text>
<text id="t63" x="943" y="1324" font-size="21" fill="#53677f" font-weight="400" text-anchor="start" data-bound="938,1250,1287,1375">模型规划、编写和修改代码</text>
<text id="t64" x="943" y="1356" font-size="21" fill="#53677f" font-weight="400" text-anchor="start" data-bound="938,1250,1287,1375">外部工具负责查询与操作</text>
<path d="M1313 1314h23m-8-7 8 7-8 7" stroke="#8499b5" stroke-width="2.5" fill="none"/>
<rect x="1345" y="1240" width="385" height="145" rx="14" fill="#fff" stroke="#d8e3ed"/>
<text id="t65" x="1368" y="1281" font-size="27" fill="#192d49" font-weight="700" text-anchor="start" data-bound="1363,1250,1712,1375">检查并继续优化</text>
<text id="t66" x="1368" y="1324" font-size="21" fill="#53677f" font-weight="400" text-anchor="start" data-bound="1363,1250,1712,1375">浏览器观察 + 人工复核</text>
<text id="t67" x="1368" y="1356" font-size="21" fill="#53677f" font-weight="400" text-anchor="start" data-bound="1363,1250,1712,1375">把实际问题反馈给模型</text>
<path d="M1537 1401v20H1107v-20" stroke="#7893b5" stroke-width="2" fill="none"/>
<text id="t68" x="1318" y="1456" font-size="21" fill="#315ecd" font-weight="600" text-anchor="middle">发现问题 → 修改 → 再检查</text>
<text id="t69" x="70" y="1435" font-size="23" fill="#192d49" font-weight="600" text-anchor="start">Skills 提供方法；MCP 连接工具；</text>
<text id="t70" x="70" y="1472" font-size="23" fill="#53677f" font-weight="400" text-anchor="start">设计变量将一致性落实到代码。</text>
<rect x="70" y="1511" width="42" height="38" rx="7" fill="#315ecd" stroke="#315ecd"/>
<text id="t71" x="91" y="1538" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">03</text>
<text id="t72" x="128" y="1541" font-size="30" fill="#192d49" font-weight="700" text-anchor="start">对我们的意义：找到前端辅助工具，按实际缺口采用</text>
<rect x="70" y="1578" width="810" height="236" rx="14" fill="#eaf0ff" stroke="#c6d6f6"/>
<text id="t73" x="99" y="1623" font-size="29" fill="#315ecd" font-weight="700" text-anchor="start">节省找方法、找工具的时间</text>
<text id="t74" x="99" y="1668" font-size="22" fill="#192d49" font-weight="400" text-anchor="start" data-bound="94,1590,857,1803">设计方法不足 → 找设计 Skill，提供可重复参考的指导。</text>
<text id="t75" x="99" y="1706" font-size="22" fill="#192d49" font-weight="400" text-anchor="start" data-bound="94,1590,857,1803">框架资料不足 → 找文档工具，取得相关用法和示例。</text>
<text id="t76" x="99" y="1744" font-size="22" fill="#192d49" font-weight="400" text-anchor="start" data-bound="94,1590,857,1803">需要读取设计稿 → 找 Figma 接入，补充设计结构资料。</text>
<text id="t77" x="99" y="1782" font-size="22" fill="#192d49" font-weight="400" text-anchor="start" data-bound="94,1590,857,1803">缺少页面检查 → 找浏览器工具，取得实际操作反馈。</text>
<rect x="900" y="1578" width="830" height="236" rx="14" fill="#fff" stroke="#d8e3ed"/>
<text id="t78" x="929" y="1623" font-size="29" fill="#192d49" font-weight="700" text-anchor="start">已有能力继续用，缺少时再补</text>
<text id="t79" x="929" y="1668" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="924,1590,1707,1803">我们已有网页实现与浏览器检查，不必重复配置同类工具。</text>
<text id="t80" x="929" y="1706" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="924,1590,1707,1803">目录提供候选项；具体支持来自独立 Skill 或工具。</text>
<text id="t81" x="929" y="1744" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="924,1590,1707,1803">仅阅读或克隆 README，不会自动接入这些能力。</text>
<text id="t82" x="929" y="1782" font-size="22" fill="#53677f" font-weight="400" text-anchor="start" data-bound="924,1590,1707,1803">核对官方说明，接入小任务，用真实结果判断是否保留。</text>
<rect x="70" y="1844" width="1660" height="98" rx="14" fill="#dff2ec" stroke="#c0e0d4"/>
<text id="t83" x="99" y="1883" font-size="26" fill="#235e51" font-weight="700" text-anchor="start">用于本仓库的直接做法</text>
<text id="t84" x="99" y="1920" font-size="24" fill="#315b52" font-weight="400" text-anchor="start">确认现有能力的缺口 → 在目录中找候选项 → 核对官方接入条件 → 实际使用并检查是否有帮助。</text>
<rect x="70" y="1979" width="42" height="38" rx="7" fill="#315ecd" stroke="#315ecd"/>
<text id="t85" x="91" y="2006" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">04</text>
<text id="t86" x="128" y="2009" font-size="30" fill="#192d49" font-weight="700" text-anchor="start">理解它时，保留这些边界</text>
<rect x="70" y="2042" width="1660" height="174" rx="14" fill="#192d49" stroke="#192d49"/>
<text id="t87" x="99" y="2086" font-size="24" fill="#dae6f4" font-weight="400" text-anchor="start" data-bound="94,2050,1707,2204">指南不会重新训练模型，也不会自动保证页面更美观；效果取决于需求、模型、工具配置与迭代。</text>
<text id="t88" x="99" y="2134" font-size="24" fill="#dae6f4" font-weight="400" text-anchor="start" data-bound="94,2050,1707,2204">工具目录没有内置完整运行引擎；第三方工具的能力、账户权限和安装方式需要分别核对。</text>
<text id="t89" x="99" y="2182" font-size="24" fill="#dae6f4" font-weight="400" text-anchor="start" data-bound="94,2050,1707,2204">本研究核查了文档并验证本地展厅；未实测完整工具组合，也未证明模型生成质量提升。</text>
<text id="t90" x="70" y="2274" font-size="27" fill="#192d49" font-weight="700" text-anchor="start">一句话记住：它教我们怎样指导 Claude Code 做前端、优化前端，并为这个过程选择合适的工具。</text>
<a href="https://github.com/wilwaldon/Claude-Code-Frontend-Design-Toolkit/blob/2a6d0958e6966e0003896f94ce5003466e89e91d/README.md">
<text id="t91" x="70" y="2327" font-size="20" fill="#53677f" font-weight="400" text-anchor="start">来源：wilwaldon / Claude-Code-Frontend-Design-Toolkit · 固定版本 2a6d095</text>
</a>
