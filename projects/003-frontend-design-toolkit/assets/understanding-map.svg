<text id="t1" x="70" y="56" font-size="22" fill="#bed0e6" font-weight="600" text-anchor="start">开源研究 / 003</text>
<text id="t2" x="1730" y="56" font-size="24" fill="#bed0e6" font-weight="400" text-anchor="end">Claude Code Frontend Design Toolkit</text>
<text id="t3" x="70" y="136" font-size="53" fill="#fff" font-weight="700" text-anchor="start">指导 Claude Code 做好前端设计与实现</text>
<text id="t4" x="70" y="194" font-size="27" fill="#d5e2f1" font-weight="400" text-anchor="start">一份说明指南与工具索引：告诉你怎样提设计要求、选工具、写页面、检查并改进结果。</text>
<text id="t5" x="70" y="233" font-size="22" fill="#a9c1de" font-weight="400" text-anchor="start">仓库形态：研究版本只有 README.md；具体能力由 Claude Code 与独立工具执行。</text>
<rect x="70" y="286" width="1660" height="102" rx="14" fill="#fff" stroke="#d8e3ed"/>
<text id="t6" x="99" y="327" font-size="26" fill="#315ecd" font-weight="700" text-anchor="start">改善设计</text>
<text id="t7" x="99" y="363" font-size="22" fill="#53677f" font-weight="400" text-anchor="start">让视觉选择贴合产品与内容</text>
<text id="t8" x="652" y="327" font-size="26" fill="#315ecd" font-weight="700" text-anchor="start">辅助实现</text>
<text id="t9" x="652" y="363" font-size="22" fill="#53677f" font-weight="400" text-anchor="start">让规则、文档和组件进入工作过程</text>
<text id="t10" x="1205" y="327" font-size="26" fill="#315ecd" font-weight="700" text-anchor="start">检查优化</text>
<text id="t11" x="1205" y="363" font-size="22" fill="#53677f" font-weight="400" text-anchor="start">让真实页面的反馈推动修正</text>
<rect x="70" y="414" width="42" height="38" rx="7" fill="#315ecd" stroke="#315ecd"/>
<text id="t12" x="91" y="441" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">01</text>
<text id="t13" x="128" y="444" font-size="30" fill="#192d49" font-weight="700" text-anchor="start">指南覆盖哪些方面？</text>
